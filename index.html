<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#D32F2F" />
  <meta name="description" content="FOROL Sonnen- und Schattenanalyse — interaktive 3D-Visualisierung der Besonnung von Schweizer Immobilien." />
  <meta property="og:title" content="FOROL Sonnen- und Schattenanalyse" />
  <meta property="og:description" content="Wie viele Sonnenstunden pro Jahr hat Ihre Wohnung? Interaktive 3D-Analyse für jede Schweizer Adresse." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="de_CH" />
  <title>FOROL — Sonnen- und Schattenanalyse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23D32F2F'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-family='Arial,sans-serif' font-weight='800' font-size='30' fill='%23FFF'%3EF%3C/text%3E%3C/svg%3E" />
  <style>
    #initial-loader {
      position: fixed; inset: 0;
      background: #FFFFFF;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      font-family: 'Inter', -apple-system, sans-serif;
      transition: opacity 0.4s;
    }
    #initial-loader.hide { opacity: 0; pointer-events: none; }
    #initial-loader .logo {
      font-size: 32px; font-weight: 700;
      color: #D32F2F; letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    #initial-loader .sub {
      font-size: 12px; color: #666; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 28px;
    }
    #initial-loader .bar {
      width: 180px; height: 2px;
      background: #E0E0E0; border-radius: 1px; overflow: hidden;
    }
    #initial-loader .bar::after {
      content: ''; display: block; height: 100%;
      background: #D32F2F;
      animation: loaderbar 1.2s ease-in-out infinite;
    }
    @keyframes loaderbar {
      0% { transform: translateX(-100%); width: 30%; }
      50% { transform: translateX(120%); width: 50%; }
      100% { transform: translateX(300%); width: 30%; }
    }
  </style>
</head>
<body>
  <div id="initial-loader">
    <div class="logo">FOROL</div>
    <div class="sub">Sonnen- und Schattenanalyse</div>
    <div class="bar"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    let attempts = 0;
    const checkReady = () => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('hide');
          setTimeout(() => loader.remove(), 400);
        }
      } else if (attempts++ < 100) {
        setTimeout(checkReady, 50);
      }
    };
    setTimeout(checkReady, 50);
  </script>
</body>
</html>
